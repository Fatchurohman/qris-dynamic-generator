<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS Dynamic Generator - Luxury Edition</title>
  <!-- Library QR Code CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #171d2b 0%, #0a0d14 100%);
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 215, 0, 0.18);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-hover: #e6c65c;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(10, 13, 20, 0.85);
      --input-border: rgba(255, 255, 255, 0.1);
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px var(--gold-glow);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge-developer {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--gold-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold-primary);
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
        box-shadow: 0 0 2px var(--gold-primary);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
        box-shadow: 0 0 12px var(--gold-primary);
      }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 30%, var(--gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--gold-primary) 0%, #b89327 100%);
      color: #0b0d14;
      font-size: 1rem;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--gold-hover) 0%, var(--gold-primary) 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .result-section {
      display: none;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .qr-frame {
      display: inline-block;
      padding: 16px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }

    .qr-frame img {
      display: block;
      margin: 0 auto;
    }

    .amount-display {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .speech-preview {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 16px;
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .action-btn.btn-voice {
      border-color: rgba(212, 175, 55, 0.4);
      color: var(--gold-light);
    }

    .error-text {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge-developer">
        <div class="pulse-dot"></div>
        <span>Developer: fatur62</span>
      </div>
      <h1>QRIS Dynamic Generator</h1>
      <p class="subtitle">Konversi QRIS Statis menjadi Dinamis Nominal Otomatis</p>
    </div>

    <form id="qrisForm" onsubmit="handleGenerate(event)">
      <div class="form-group">
        <label for="rawQris">Payload / String QRIS Statis</label>
        <textarea id="rawQris" placeholder="Contoh: 00020101021126570011ID.DANA.WWW..." required></textarea>
        <div id="qrisError" class="error-text">Format QRIS tidak valid! Harus diawali '000201'.</div>
      </div>

      <div class="form-group">
        <label for="nominal">Nominal Tagihan (Rp)</label>
        <input type="text" id="nominal" placeholder="0" inputmode="numeric" required>
        <div class="presets">
          <button type="button" class="preset-btn" onclick="setNominal(10000)">+10.000</button>
          <button type="button" class="preset-btn" onclick="setNominal(20000)">+20.000</button>
          <button type="button" class="preset-btn" onclick="setNominal(50000)">+50.000</button>
          <button type="button" class="preset-btn" onclick="setNominal(100000)">+100.000</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Generate QRIS Dinamis</button>
    </form>

    <div id="resultSection" class="result-section">
      <div class="amount-display" id="displayAmount">Rp 0</div>
      <div class="speech-preview" id="speechPreview"></div>
      <div class="qr-frame">
        <div id="qrcode"></div>
      </div>
      <div class="action-group">
        <button type="button" class="action-btn btn-voice" onclick="speakCurrentAmount()">🔊 Ulangi Suara</button>
        <button type="button" class="action-btn" onclick="copyPayload()">Salin Payload</button>
        <button type="button" class="action-btn" onclick="resetForm()">Reset</button>
      </div>
    </div>
  </div>

  <script>
    let generatedPayload = "";
    let currentNominalValue = 0;

    // Format Rupiah Input
    const nominalInput = document.getElementById('nominal');
    nominalInput.addEventListener('input', (e) => {
      const cleanValue = e.target.value.replace(/\D/g, '');
      e.target.value = cleanValue ? Number(cleanValue).toLocaleString('id-ID') : '';
    });

    function setNominal(amount) {
      nominalInput.value = amount.toLocaleString('id-ID');
    }

    // Engine Konversi Angka ke Terbilang Bahasa Indonesia
    function numberToWords(number) {
      const units = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
      const n = Math.floor(number);

      if (n < 12) {
        return units[n];
      } else if (n < 20) {
        return numberToWords(n - 10) + " Belas";
      } else if (n < 100) {
        return numberToWords(Math.floor(n / 10)) + " Puluh " + units[n % 10];
      } else if (n < 200) {
        return "Seratus " + numberToWords(n - 100);
      } else if (n < 1000) {
        return numberToWords(Math.floor(n / 100)) + " Ratus " + numberToWords(n % 100);
      } else if (n < 2000) {
        return "Seribu " + numberToWords(n - 1000);
      } else if (n < 1000000) {
        return numberToWords(Math.floor(n / 1000)) + " Ribu " + numberToWords(n % 1000);
      } else if (n < 1000000000) {
        return numberToWords(Math.floor(n / 1000000)) + " Juta " + numberToWords(n % 1000000);
      } else if (n < 1000000000000) {
        return numberToWords(Math.floor(n / 1000000000)) + " Miliar " + numberToWords(n % 1000000000);
      }
      return "";
    }

    // Engine Suara (Web Speech API Native)
    function speakAmount(amount) {
      if (!('speechSynthesis' in window)) {
        console.warn("Browser tidak mendukung Web Speech API");
        return;
      }

      window.speechSynthesis.cancel(); // Stop suara aktif sebelumnya

      const words = numberToWords(amount).trim();
      const speechText = `Total pembayaran sebesar ${words} rupiah.`;
      
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = 'id-ID';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;

      // Prioritaskan suara bahasa Indonesia jika tersedia
      const voices = window.speechSynthesis.getVoices();
      const idVoice = voices.find(v => v.lang.includes('id') || v.lang.includes('ID'));
      if (idVoice) {
        utterance.voice = idVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentAmount() {
      if (currentNominalValue > 0) {
        speakAmount(currentNominalValue);
      }
    }

    // Algoritma Checksum CRC16-CCITT (0xFFFF)
    function calculateCRC16(str) {
      let crc = 0xFFFF;
      for (let c = 0; c < str.length; c++) {
        crc ^= str.charCodeAt(c) << 8;
        for (let i = 0; i < 8; i++) {
          if (crc & 0x8000) {
            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          } else {
            crc = (crc << 1) & 0xFFFF;
          }
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    // Engine Konversi EMVCo QRIS Statis ke Dinamis
    function generateDynamicQRIS(staticQris, amount) {
      let qris = staticQris.trim();
      
      if (!qris.startsWith("000201")) {
        throw new Error("Payload QRIS tidak valid (harus dimulai dengan 000201)");
      }

      const tag63Index = qris.indexOf("6304");
      if (tag63Index !== -1) {
        qris = qris.substring(0, tag63Index);
      }

      qris = qris.replace("010211", "010212");

      const amountStr = amount.toString();
      const amountLength = amountStr.length.toString().padStart(2, '0');
      const tag54 = `54${amountLength}${amountStr}`;

      qris = qris.replace(/54\d{2}\d+/, '');

      const tag58Pos = qris.indexOf("5802ID");
      if (tag58Pos !== -1) {
        qris = qris.substring(0, tag58Pos) + tag54 + qris.substring(tag58Pos);
      } else {
        qris = qris + tag54;
      }

      const payloadWithoutCRC = qris + "6304";
      const newCRC = calculateCRC16(payloadWithoutCRC);

      return payloadWithoutCRC + newCRC;
    }

    function handleGenerate(event) {
      event.preventDefault();
      const rawQris = document.getElementById('rawQris').value;
      const nominalRaw = nominalInput.value.replace(/\D/g, '');
      const errorLabel = document.getElementById('qrisError');

      errorLabel.style.display = 'none';

      if (!nominalRaw || Number(nominalRaw) <= 0) {
        alert("Silakan masukkan nominal transaksi yang valid!");
        return;
      }

      try {
        const amountNum = Number(nominalRaw);
        currentNominalValue = amountNum;
        generatedPayload = generateDynamicQRIS(rawQris, amountNum);
        
        // Render QR Code
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: generatedPayload,
          width: 220,
          height: 220,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        // Update Text Display & Speech Preview
        const words = numberToWords(amountNum).trim();
        document.getElementById('displayAmount').textContent = `Total: Rp ${amountNum.toLocaleString('id-ID')}`;
        document.getElementById('speechPreview').textContent = `"${words} Rupiah"`;
        document.getElementById('resultSection').style.display = 'block';
        document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });

        // Trigger Efek Suara
        speakAmount(amountNum);

      } catch (err) {
        errorLabel.textContent = err.message;
        errorLabel.style.display = 'block';
      }
    }

    function copyPayload() {
      if (!generatedPayload) return;
      navigator.clipboard.writeText(generatedPayload).then(() => {
        alert("Payload QRIS Dinamis berhasil disalin ke clipboard!");
      });
    }

    function resetForm() {
      window.speechSynthesis.cancel();
      document.getElementById('qrisForm').reset();
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('qrcode').innerHTML = '';
      generatedPayload = "";
      currentNominalValue = 0;
    }

    // Preload voice list
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
</html>
